<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Anomaly Demo</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%);
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --color-success: #10b981;
            --color-error: #ef4444;
            --color-primary: #6366f1;
            --color-primary-hover: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Glows */
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .glow-orb-1 {
            top: -100px;
            left: -100px;
        }

        .glow-orb-2 {
            bottom: -150px;
            right: -100px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
        }

        /* Glassmorphic Container */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 560px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                        0 0 40px var(--accent-glow);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Connection Status Badge */
        .status-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 32px;
            font-size: 0.875rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            box-shadow: 0 0 8px var(--text-secondary);
            transition: all 0.3s ease;
        }

        /* Connected State styles */
        .status-badge.connected {
            color: var(--color-success);
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .status-badge.connected .status-dot {
            background-color: var(--color-success);
            box-shadow: 0 0 10px var(--color-success);
            animation: pulse 2s infinite;
        }

        /* Error/Disconnected State styles */
        .status-badge.disconnected {
            color: var(--color-error);
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .status-badge.disconnected .status-dot {
            background-color: var(--color-error);
            box-shadow: 0 0 10px var(--color-error);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Interactive Card/Response Box */
        .response-container {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            min-height: 120px;
            max-height: 250px;
            overflow-y: auto;
            color: #a5b4fc;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.3s ease;
        }

        .response-container.active {
            border-color: rgba(99, 102, 241, 0.3);
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
            width: 100%;
        }

        .placeholder-text {
            color: var(--text-secondary);
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }

        /* Buttons */
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-hover) 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="container">
        <header>
            <h1>Expense Anomaly</h1>
            <div class="subtitle">FastAPI + HTML5 Starter Demo</div>
        </header>

        <div class="status-wrapper">
            <div id="status-badge" class="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Checking Backend Status...</span>
            </div>
        </div>

        <div id="response-box" class="response-container">
            <div id="placeholder" class="placeholder-text">Click "Fetch API Data" to query the backend server</div>
        </div>

        <button id="fetch-btn" class="btn">
            <span id="btn-spinner" class="spinner"></span>
            <span id="btn-text">Fetch API Data</span>
        </button>

        <footer>
            Expense Anomaly Detector &copy; 2026
        </footer>
    </div>

    <script>
        const API_URL = 'https://expense-anomaly-demo.onrender.com';
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const responseBox = document.getElementById('response-box');
        const placeholder = document.getElementById('placeholder');
        const fetchBtn = document.getElementById('fetch-btn');
        const btnSpinner = document.getElementById('btn-spinner');
        const btnText = document.getElementById('btn-text');

        // Check backend health periodically
        async function checkHealth() {
            try {
                const res = await fetch(`${API_URL}/api/health`, { method: 'GET' });
                if (res.ok) {
                    statusBadge.className = 'status-badge connected';
                    statusText.textContent = 'Backend Online';
                } else {
                    throw new Error('Not ok');
                }
            } catch (err) {
                statusBadge.className = 'status-badge disconnected';
                statusText.textContent = 'Backend Offline';
            }
        }

        // Fetch hello world from API
        async function fetchHello() {
            // UI Feedback
            btnSpinner.style.display = 'inline-block';
            btnText.textContent = 'Fetching...';
            fetchBtn.disabled = true;
            responseBox.classList.add('active');

            try {
                const startTime = performance.now();
                const res = await fetch(`${API_URL}/`, { method: 'GET' });
                const duration = (performance.now() - startTime).toFixed(1);
                
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                
                const data = await res.json();
                
                // Clear placeholder
                if (placeholder) placeholder.style.display = 'none';
                
                responseBox.innerHTML = `<pre>{\n  "status": ${res.status},\n  "time": "${duration}ms",\n  "data": ${JSON.stringify(data, null, 2).replace(/\n/g, '\n  ')}\n}</pre>`;
            } catch (err) {
                if (placeholder) placeholder.style.display = 'none';
                responseBox.innerHTML = `<pre style="color: var(--color-error)">Error connecting to Backend:\n${err.message}\n\nMake sure the backend is running at ${API_URL}</pre>`;
            } finally {
                btnSpinner.style.display = 'none';
                btnText.textContent = 'Fetch API Data';
                fetchBtn.disabled = false;
                setTimeout(() => responseBox.classList.remove('active'), 500);
            }
        }

        // Initial connection check
        checkHealth();
        // Check every 5 seconds
        setInterval(checkHealth, 5000);

        // Bind event
        fetchBtn.addEventListener('click', fetchHello);
    </script>
</body>
</html>
